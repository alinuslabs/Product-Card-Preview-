<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/Favicon-circle.png">

    <title>Alinus Labs | Product preview card component</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <img src="./assets/images/image-product-desktop.jpg" class="desktop-img" alt="">
        <img src="./assets/images/image-product-mobile.jpg" class="mobile-img" alt="">
        
        <div class="product-info">
            <span class="product-category">Perfume</span>

            <h2 class="product-name">Gabrielle Essence Eau De Parfum</h2>

            <p class="product-description">
                A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
            </p>

            <div class="product-price">
                <span class="discount">$149.99</span>
                <span class="original">$169.99</span>
            </div>

            <button class="cart">
                <img src="./assets/images/icon-cart.svg" alt=""> Add to Cart
            </button>
        </div>
    </div>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="https://x.com/alinuslabs">Alinus Labs</a>.
    </footer>
</body>
</html>
